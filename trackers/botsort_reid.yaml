# BoT-SORT + ReID (optional). Use with:
#   python detect_grid.py --tracker trackers/botsort_reid.yaml ...
#
# Ultralytics BoT-SORT only accepts YOLO/ONNX ReID assets here (not OSNet .pth).
# Stable-ID layer can still use --reid-model osnet_ain separately.
tracker_type: botsort
track_high_thresh: 0.35
track_low_thresh: 0.1
new_track_thresh: 0.65
track_buffer: 120
match_thresh: 0.8
fuse_score: True
gmc_method: sparseOptFlow
proximity_thresh: 0.5
appearance_thresh: 0.25
with_reid: True
model: yolo26n-reid.onnx
